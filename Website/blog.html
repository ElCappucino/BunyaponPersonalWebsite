<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog – Bunyapon Chaiongkarn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- page-scroll turns off the Games page's height: 100vh cap (see
       style.css) so this list can grow past one screen as posts pile
       up — same reason post.html and about.html both use it. -->
  <div class="page page-scroll">

    <img class="coffee-decor" src="../Assets/Coffee.png" alt="" aria-hidden="true">

    <header class="topbar">
      <p class="brand">Bunyapon Chaiongkarn</p>
      <nav class="nav">
        <a href="index.html">Games</a>
        <a href="blog.html" aria-current="page">Blog</a>
        <a href="about.html">About</a>
      </nav>
    </header>

    <main class="blog-layout page-content">
      <!-- Filled in by blog.js from POSTS in posts.js — add a post
           there and a card for it appears here on its own, no editing
           needed in this file. -->
      <div class="blog-list" id="blogList"></div>
    </main>

  </div>

  <script src="pagefade.js" defer></script>
  <script src="posts.js" defer></script>
  <script src="blog.js" defer></script>
</body>
</html>
